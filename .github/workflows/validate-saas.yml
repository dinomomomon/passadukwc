name: Validate Kru Pasadu SaaS
on:
  push:
    branches:
      - feature/kru-pasadu-v01
  pull_request:
    branches:
      - main
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - name: Run form regression tests and build
        run: npm run build
