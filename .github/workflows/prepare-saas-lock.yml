name: Prepare Kru Pasadu dependency lockfile
on:
  push:
    branches:
      - feature/kru-pasadu-v01
    paths:
      - .github/workflows/prepare-saas-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Generate a verified lockfile
        working-directory: saas
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit validated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saas/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified SaaS dependency lockfile for Cloudflare npm ci"
            git push
          fi
