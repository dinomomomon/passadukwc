<title>ครูพัสดุ | KRU PASADU</title>
<link rel="canonical" href="https://kru-pasadu.vercel.app/">
<script>
(function(){
  // Remove attribution parameters only; never strip auth/recovery query or hash.
  try{
    var url=new URL(location.href),changed=false;
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid'].forEach(function(key){
      if(url.searchParams.has(key)){url.searchParams.delete(key);changed=true;}
    });
    if(changed)history.replaceState(history.state,'',url.pathname+url.search+url.hash);
  }catch(ignore){}
  var timeoutId;
  function showRecovery(message){
    var app=document.getElementById('app');
    if(!app||!app.querySelector('.loading-screen'))return;
    app.innerHTML='<main class="startup-failure" role="alert" aria-live="assertive">'+
      '<img src="/kru-pasadu-icon.svg" width="82" height="82" alt="โลโก้ครูพัสดุ">'+
      '<h1>เปิดครูพัสดุไม่สำเร็จ</h1>'+
      '<p>'+message+'</p>'+
      '<div class="startup-actions"><button type="button" id="kru-try-again">ลองเปิดใหม่</button>'+
      '<button type="button" id="kru-repair-auth">ล้างเซสชันบัญชี (ขั้นแรก)</button>'+
      '<a class="startup-diagnostics-link" href="/diagnostics.html">ตรวจสอบสาเหตุใน Chrome</a></div>'+
      '<small>หากเคยลองล้างเซสชันแล้วไม่สำเร็จ ให้กด “ตรวจสอบสาเหตุใน Chrome” การล้างข้อมูลเว็บไซต์ทั้งหมดต้องทำผ่านการตั้งค่า Chrome และอาจลบแบบร่างที่ไม่ได้บันทึก</small>'+
      '</main>';
    document.getElementById('kru-try-again').addEventListener('click',function(){location.reload();});
    document.getElementById('kru-repair-auth').addEventListener('click',function(){
      if(!confirm('ต้องการล้างเฉพาะข้อมูลเข้าสู่ระบบครูพัสดุที่เก็บใน Chrome เครื่องนี้หรือไม่? คุณจะต้องกรอกอีเมลและรหัสผ่านเพื่อเข้าสู่ระบบใหม่ แต่เอกสารที่บันทึกบนเซิร์ฟเวอร์จะไม่ถูกลบ'))return;
      try{
        localStorage.removeItem('sb-xwtynagykjqhlzmkitrx-auth-token');
        sessionStorage.removeItem('sb-xwtynagykjqhlzmkitrx-auth-token');
        location.assign('/');
      }catch(error){
        alert('Chrome ไม่อนุญาตให้เข้าถึงข้อมูลบัญชี กรุณาลองในหน้าต่างไม่ระบุตัวตน หรือล้างข้อมูลเว็บไซต์เฉพาะ kru-pasadu.vercel.app จากการตั้งค่า Chrome');
      }
    });
  }
  // Starts immediately, not after DOMContentLoaded (CSS can delay that event).
  timeoutId=setTimeout(function(){
    showRecovery('การเปิดระบบใช้เวลานานกว่าปกติ กรุณาเปิดหน้าตรวจสอบเพื่อแยกว่าเกิดจากไฟล์เว็บไซต์ เครือข่าย หรือข้อมูลใน Chrome');
  },30000);
  window.addEventListener('kru:ready',function(){clearTimeout(timeoutId);},{once:true});
  window.addEventListener('kru:dependency-error',function(){
    clearTimeout(timeoutId);
    showRecovery('Chrome โหลดส่วนเชื่อมต่อระบบบัญชีจากเครือข่ายไม่สำเร็จ กรุณาลองใหม่ หรือปิดส่วนขยายที่อาจบล็อก CDN');
  },{once:true});
})();
</script>

<style id="kru-account-styles">
/* ครูพัสดุ – staff identity + clear logout (UI only, never printed) */
#app .topbar{gap:18px}
#app .top-school{flex:1;min-width:0}
#app .top-actions{display:flex;align-items:center;flex-shrink:0;gap:10px}
#app .account-identity{
  border:1px solid #D6E5FA;border-radius:13px;
  display:flex;align-items:center;gap:10px;
  padding:7px 11px;background:#F5F9FF;
  color:#173B75;max-width:350px;min-width:0;text-align:left;
  box-shadow:0 2px 8px rgba(16,88,181,.04);
  cursor:pointer;transition:background .15s,border-color .15s;
}
#app button.account-identity:hover{border-color:#8DBDF6;background:#EAF3FF}
#app .account-identity-demo{cursor:default}
#app .account-user-icon{display:grid;place-items:center;flex:0 0 33px;width:33px;height:33px;border-radius:10px;background:#DDEBFF;color:#1265D2}
#app .account-user-details{display:flex;flex-direction:column;gap:1px;min-width:0}
#app .account-user-details strong{
  display:block;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#123E85;font-size:14px;font-weight:800;line-height:1.3
}
#app .account-user-details small{display:block;color:#5B7596;font-size:11px;font-weight:600;line-height:1.4}
#app .account-pencil{color:#0C66D5;border-left:1px solid #C9DDF5;padding-left:10px;font-size:11px;font-weight:700;white-space:nowrap}
#app .logout-button{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  gap:9px;white-space:nowrap;min-height:42px;
  border:1px solid #FFC58D;border-radius:11px;
  background:#FFF1E2;color:#9E4B05;
  padding:10px 15px;font-size:14px;font-weight:800;
  box-shadow:none;cursor:pointer;transition:background .15s,border-color .15s;
}
#app .logout-button:hover{background:#FFE3C4;border-color:#F5AA61;color:#853D04}
#app .logout-button svg{width:18px;height:18px;flex-shrink:0}
#app .account-identity:focus-visible,#app .logout-button:focus-visible{outline:3px solid #FF9C38;outline-offset:2px}
#app .profile-dialog{
  border:1px solid #D4E4F9;border-radius:20px;
  padding:0;width:min(92vw,510px);max-height:90vh;
  background:white;color:#183A69;
  box-shadow:0 24px 74px rgba(9,48,117,.28);
}
#app .profile-dialog::backdrop{background:rgba(7,26,66,.53);backdrop-filter:blur(3px)}
#app .profile-panel{padding:28px}
#app .profile-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:7px}
#app .profile-panel-head h2{font-size:22px;line-height:1.4;margin:0;color:#143E79}
#app .profile-panel p{font-size:13px;line-height:1.6;margin-bottom:19px}
#app .profile-close{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:9px;background:#EFF4FC;color:#4F6D93;font-size:23px;cursor:pointer}
#app .profile-close:hover{background:#E0EFFF}
#app .profile-controls{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding-top:8px}
@media(max-width:1050px){
  #app .top-actions .tag{display:none}
  #app .account-identity{max-width:280px}
  #app .account-user-details strong{max-width:150px}
  #app .account-pencil{display:none}
}
@media(max-width:800px){
  #app .topbar{gap:8px}
  #app .top-school .school-logo{display:none}
  #app .top-actions{gap:6px}
  #app .account-identity{padding:5px 7px;gap:6px}
  #app .account-user-icon{flex-basis:28px;width:28px;height:28px}
  #app .account-user-details strong{font-size:12px;max-width:130px}
  #app .account-user-details small{font-size:10px}
  #app .logout-button{font-size:12px;min-height:36px;padding:7px 10px;gap:5px}
}
@media(max-width:570px){
  #app .topbar{padding:0 9px}
  #app .top-school h2{font-size:12px}
  #app .top-school p{display:none}
  #app .account-identity{max-width:150px;padding:5px}
  #app .account-user-details strong{max-width:105px;font-size:11px}
  #app .account-user-details small{font-size:9px}
  #app .account-user-icon{display:none}
  #app .logout-button{padding:7px 8px;font-size:11px}
  #app .logout-button svg{width:15px;height:15px}
  #app .profile-panel{padding:20px}
}
@media(max-width:390px){
  #app .top-school{display:none}
  #app .top-actions{width:100%;justify-content:space-between}
  #app .account-identity{max-width:210px}
  #app .account-user-details strong{max-width:160px}
  #app .logout-button{font-size:12px}
}
@media print{
  #app .account-identity,#app .logout-button,#app .profile-dialog{display:none!important}
}

/* Thai-language sign-up verification fallback (only when Supabase requires email confirmation). */
#app .verify-illustration{
  display:grid;place-items:center;width:54px;height:54px;border-radius:16px;
  background:#E6F5F0;color:#12856F;margin-bottom:20px;
  box-shadow:inset 0 0 0 1px #CBEBE0;
}
#app .verify-illustration svg{width:28px;height:28px}
#app .verify-email-box{
  display:flex;flex-direction:column;gap:4px;
  padding:14px 17px;background:#EFF5FF;border:1px solid #D5E5FB;
  border-radius:12px;margin:18px 0;color:#5A7290
}
#app .verify-email-box span{font-size:12px}
#app .verify-email-box strong{color:#0E54AE;font-size:15px;overflow-wrap:anywhere}
#app .verify-steps{padding:4px 0 11px}
#app .verify-steps p{font-size:13px;line-height:1.75;color:#415B79;margin:0 0 8px}
#app .verify-steps b{color:#115FC7}
#app .verify-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
#app .verify-actions button{flex:1 1 170px}

</style>
